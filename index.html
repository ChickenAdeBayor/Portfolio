<script>
  // Applied before first paint so a stored preference never flashes the
  // wrong theme. If nothing is stored, the CSS media query alone decides.
  (function(){
    try {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || stored === 'light'){
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {}
  })();
</script>
